[project]
name = "omsorgsradar"
version = "0.1.0"
description = "Agentic data-analysis pipeline over SSB/FHI open data — demografisk aldring vs kommunal omsorgskapasitet mot 2035"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.109.1",
    "duckdb>=1.5.3",
    "jinja2>=3.1.6",
    "jsonschema>=4.23",
    "marimo>=0.23.9",
    "markdown>=3.10.2",
    "matplotlib>=3.10.9",
    "nh3>=0.3.5",
    "numpy>=2.4.6",
    "openai>=2.41.1",
    "pandas>=3.0.3",
    "presidio-analyzer>=2.2.362",
    "presidio-anonymizer>=2.2.362",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "shap>=0.51.0",
    "spacy>=3.8.14",
    "tabpfn>=8.0.8",
    "xgboost>=3.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short -m 'not live'"
markers = [
    "live: marks tests that require network/API access (skip with -m 'not live')",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
omsorgsradar = ["templates/**/*"]
