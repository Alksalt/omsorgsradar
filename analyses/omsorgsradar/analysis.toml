[analysis]
name = "omsorgsradar"
question = "Hvilke kommuner får den hardeste skvisen mellom aldrende befolkning og dagens omsorgskapasitet fram mot 2035?"
language = "nb"

[stages]
list = ["ingest", "profile", "analyze", "verify", "report", "ml"]

[[sources]]
adapter = "pxweb"
id = "kostra_pleie"
base_url = "https://data.ssb.no/api/v0/no/table"
table = "12209"
# Required: an SSB outage fails loudly rather than silently shipping a weaker report.
required = true

[sources.var_map]
hjemmetjeneste_andel = "KOShjtj80aarover0001"
institusjon_andel = "KOSsykhjand80aar0000"
aarsverk_per_bruker = "KOSaarsvbrukerom0000"
utgifter_per_innbygger = "KOSbduFKG9innbyg0000"

[[sources]]
adapter = "pxweb"
id = "befolkning"
base_url = "https://data.ssb.no/api/v0/no/table"
table = "07459"
# Required: an SSB outage fails loudly rather than silently shipping a weaker report.
required = true

[[sources]]
adapter = "pxweb"
id = "framskrivinger"
base_url = "https://data.ssb.no/api/v0/no/table"
# 13599: Framskrevet folkemengde etter kjønn, alder, framskrivingsalternativ —
# national 1-year-age projection reaching 2100. fetch_population_projections
# selects 80+ × main alternative (MMM) × years ≤ 2035 to derive the national
# 80+ growth (stored as ssb_projection_growth_2035). The previous value (12880)
# was the macroeconomic-accounts table — no age dimension, ends 2029 — so the
# projection rate was never derivable (Finding 3 / docs/api_drift.md).
table = "13599"
# Required: an SSB projection outage fails loudly rather than silently shipping
# a weaker report that omits the SSB MMM comparison — the honesty move of this
# analysis depends on citing the SSB number alongside the trend extrapolation.
required = true

[[sources]]
adapter = "fhi"
id = "fhi_nokkel"
base_url = "https://statistikk-data.fhi.no/api/open/v1"
source = "nokkel"

[params]
projection_year = 2035

# Per-kommune 80+ CAGR guards (G7-fix). A short or noisy historical window
# extrapolated 9+ years explodes (e.g. a 2-year split-artifact window once
# put Hvaler at +252% to 2035). When a kommune rate fails either guard we
# fall back to the national rate and record it in `growth_source`.
#
# min_growth_window_years: fewest years between first and last positive 80+
#   observation required to trust a kommune-level CAGR. Below it → national
#   fallback (growth_source = "national_short_window"). Default 5: a 5-year
#   window over a 9-year projection keeps the extrapolation ratio < 2:1.
min_growth_window_years = 5

# Per-annum CAGR clamp band. A kommune rate outside [min, max] p.a. is treated
# as noise/artifact and replaced by the national rate
# (growth_source = "national_outlier_rate"). Bounds (fractions, not %):
#   -0.05  a kommune losing >5%/yr of its 80+ cohort would more than halve it
#          over the horizon — beyond plausible demographic decline, treat as noise.
#   +0.10  Norway's 80+ grows ~3.5%/yr nationally; even fast suburban kommuner
#          rarely sustain >6-7%/yr. 10% admits real signal while clamping the
#          short-window/merger artifacts that drove the Hvaler explosion.
kommune_rate_min_pa = -0.05
kommune_rate_max_pa = 0.10

# C6 interface for Task A's choropleth map (A3): anchor kommune codes for the
# four main cities (Oslo, Bergen, Trondheim, Stavanger). Task A reads
# params["report"]["map_anchor_knrs"] with a safe default of [].
[params.report]
map_anchor_knrs = ["0301", "4601", "5001", "1103"]
